<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mathematical reCAPTHA</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#202124}
body{display:flex;align-items:center;justify-content:center}
.wrap{display:flex;flex-direction:column;align-items:flex-start}
.widget{width:304px;height:78px;background:#fff;border:1px solid #d6d6d6;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.22);display:flex;align-items:center;padding:10px 11px;user-select:none}
.check-area{width:45px;height:56px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.check-area.disabled{cursor:wait;pointer-events:none}
.check{width:28px;height:28px;border:2px solid #555;border-radius:2px;background:#fff;position:relative}
.check.loading{border:3px solid #ddd;border-top-color:#4285f4;border-radius:50%;animation:spin .8s linear infinite}
.check.done{border:0;background:#fff}
.check.done:after{content:"✓";position:absolute;left:2px;top:-8px;color:#34a853;font-size:30px;font-weight:500}
.label{font-size:14px;flex:1;cursor:pointer;padding-left:4px}
.brand{text-align:center;width:65px;font-size:9px;color:#555;line-height:1.2}
.brand img{display:block;width:32px;height:32px;margin:0 auto 2px;object-fit:contain}
.brand small{font-size:8px;color:#777}
.help{display:none;width:304px;margin-top:7px;font-size:12px;color:#666;line-height:1.4}
.help a{color:#1a73e8;text-decoration:underline;cursor:pointer}
.cheats{position:fixed;right:12px;top:10px;color:#d93025;font-size:14px;font-weight:700;z-index:200;display:none}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.show{display:flex}
.dialog{width:min(700px,calc(100vw - 26px));background:#fff;border-radius:2px;box-shadow:0 8px 30px rgba(0,0,0,.38);overflow:hidden}
.head{background:#4285f4;color:#fff;padding:20px 23px 18px}
.title{margin:0 0 7px;font-size:20px;font-weight:400}
.sub{font-size:13px;line-height:1.4}
.body{padding:19px 23px 21px}
.content{display:grid;grid-template-columns:205px minmax(250px,1fr);gap:17px}
.content.no-draw{grid-template-columns:1fr}
.answers{display:flex;flex-direction:column;gap:10px;justify-content:center}
.option{min-height:45px;border:1px solid #dadce0;border-radius:3px;display:flex;align-items:center;padding:7px 10px;cursor:pointer;background:#fff}
.option:hover{background:#f8f9fa}
.option input{width:18px;height:18px;margin:0 9px 0 0;accent-color:#1a73e8}
.value{font-size:15px}
.scratch{display:flex;flex-direction:column;gap:7px}
.scratch.hidden{display:none}
.scratch-label{font-size:12px;color:#5f6368}
.canvas-box{height:270px;border:1px solid #cfd3d8;position:relative;background:#fff;touch-action:none}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.clear{position:absolute;top:8px;right:8px;border:1px solid #dadce0;background:#fff;color:#5f6368;border-radius:3px;padding:5px 8px;font-size:11px;cursor:pointer}
.error{min-height:18px;margin-top:8px;color:#d93025;font-size:12px}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.count{font-size:12px;color:#5f6368}
.btns{display:flex;gap:8px}
.btn{min-width:96px;padding:9px 16px;border:1px solid #dadce0;background:#fff;border-radius:3px;font-size:14px;color:#1a73e8;cursor:pointer}
.btn.primary{background:#1a73e8;border-color:#1a73e8;color:#fff}
.btn.primary:hover{background:#185abc}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:620px){.content{grid-template-columns:1fr}.canvas-box{height:225px}.body{padding:16px 17px 18px}.head{padding:18px 17px 16px}}
</style>
</head>
<body>
<div class="cheats" id="cheatsIndicator">Cheats ativado!</div>

<div class="wrap">
  <div class="widget">
    <div class="check-area disabled" id="checkArea" tabindex="0" role="button" aria-label="Não sou um robô">
      <div class="check loading" id="check"></div>
    </div>
    <div class="label" id="label">Carregando...</div>
    <div class="brand" aria-hidden="true">
      <img src="recaptha logo.png" alt="reCAPTCHA">
      <div>reCAPTCHA</div>
      <small>Privacidade - Termos</small>
    </div>
  </div>
  <div class="help" id="help">Você não é um robô. Tente novamente clicando <a href="#" id="retry">aqui</a></div>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="title">
    <div class="head">
      <h2 class="title" id="title"></h2>
      <div class="sub">Selecione a resposta correta e use o quadro ao lado para fazer a conta.</div>
    </div>
    <div class="body">
      <div class="content" id="content">
        <div class="answers" id="answers"></div>
        <div class="scratch" id="scratch">
          <div class="scratch-label">Faça a conta no quadro:</div>
          <div class="canvas-box">
            <canvas id="canvas"></canvas>
            <button class="clear" id="clear" type="button">Limpar</button>
          </div>
        </div>
      </div>
      <div class="error" id="error"></div>
      <div class="footer">
        <div class="count" id="count">Questão 1 de 4</div>
        <div class="btns">
          <button class="btn" id="cancel" type="button">Cancelar</button>
          <button class="btn primary" id="verify" type="button">Verificar</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  const TOTAL = 4;

  // Troque apenas o usuário/branch se o repositório não estiver neste endereço.
  const SETTINGS_URL = "https://raw.githubusercontent.com/TheuXs/Mathematical-reCAPTHA/main/settings.json";

  const defaults = { difficulty: 6, draw: true, cheats: false };
  let settings = {...defaults};
  let question = 1, current = null, completed = false, drawing = false, initialized = false;

  const $ = id => document.getElementById(id);
  const overlay=$('overlay'), check=$('check'), checkArea=$('checkArea'), label=$('label'), help=$('help'), retry=$('retry');
  const title=$('title'), answers=$('answers'), count=$('count'), error=$('error'), verify=$('verify'), cancel=$('cancel');
  const clear=$('clear'), canvas=$('canvas'), scratch=$('scratch'), content=$('content'), cheatsIndicator=$('cheatsIndicator');
  const ctx=canvas.getContext('2d');

  const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

  function normalizeSettings(raw){
    const difficulty = Number(raw?.difficulty);
    return {
      difficulty: Number.isInteger(difficulty) && difficulty>=1 && difficulty<=6 ? difficulty : defaults.difficulty,
      draw: typeof raw?.draw === 'boolean' ? raw.draw : defaults.draw,
      cheats: typeof raw?.cheats === 'boolean' ? raw.cheats : defaults.cheats
    };
  }

  async function loadSettings(){
    // O timestamp torna cada abertura uma requisição diferente e cache:false evita cache do navegador.
    const url = SETTINGS_URL + (SETTINGS_URL.includes('?') ? '&' : '?') + '_=' + Date.now();
    try {
      const response = await fetch(url, {cache:'no-store'});
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const raw = await response.json();
      settings = normalizeSettings(raw);
    } catch (e) {
      console.warn('Não foi possível carregar settings.json. Usando configurações padrão.', e);
      settings = {...defaults};
    }

    initialized = true;
    check.className='check';
    checkArea.classList.remove('disabled');
    label.textContent='Não sou um robô';
    cheatsIndicator.style.display = settings.cheats ? 'block' : 'none';
    scratch.classList.toggle('hidden', !settings.draw);
    content.classList.toggle('no-draw', !settings.draw);
  }

  function makeQuestion(){
    let a,b,op,ans;
    const d=settings.difficulty;

    if(d===1){
      op='+'; a=rand(1,30); b=rand(1,30); ans=a+b;
    } else if(d===2){
      op='-'; a=rand(1,40); b=rand(1,40); if(b>a)[a,b]=[b,a]; ans=a-b;
    } else if(d===3){
      op='×'; a=rand(2,12); b=rand(2,12); ans=a*b;
    } else if(d===4){
      op='÷'; b=rand(2,12); ans=rand(1,12); a=b*ans;
    } else if(d===5){
      op='%'; b=rand(2,12); ans=rand(0,b-1); a=rand(2,15)*b+ans;
    } else {
      const ops=['+','-','×','÷','%'];
      op=ops[rand(0,ops.length-1)];
      if(op==='+'){a=rand(1,30);b=rand(1,30);ans=a+b}
      else if(op==='-'){a=rand(1,40);b=rand(1,40);if(b>a)[a,b]=[b,a];ans=a-b}
      else if(op==='×'){a=rand(2,12);b=rand(2,12);ans=a*b}
      else if(op==='÷'){b=rand(2,12);ans=rand(1,12);a=b*ans}
      else {b=rand(2,12);ans=rand(0,b-1);a=rand(2,15)*b+ans}
    }
    return {a,b,op,answer:ans,text:`${a} ${op} ${b}`};
  }

  function options(correct){
    const s=new Set([correct]);
    const spread=Math.max(2,Math.floor(Math.abs(correct)*0.3)+2);
    while(s.size<4){
      const n=correct+rand(-spread,spread);
      if(n!==correct) s.add(n);
    }
    const a=[...s];
    for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}
    return a;
  }

  function resizeCanvas(clearIt=true){
    const r=canvas.getBoundingClientRect();
    if(!r.width || !r.height)return;
    const dpr=Math.max(1,devicePixelRatio||1);
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#202124';
    if(clearIt)clearDrawing();
  }
  function clearDrawing(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height)}
  function point(e){const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}
  function start(e){drawing=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()}
  function move(e){if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()}
  function stop(e){if(!drawing)return;drawing=false;ctx.closePath();if(e)e.preventDefault()}

  canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); canvas.addEventListener('mouseup',stop); canvas.addEventListener('mouseleave',stop);
  canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',stop,{passive:false});
  clear.onclick=clearDrawing;
  addEventListener('resize',()=>{if(overlay.classList.contains('show') && settings.draw)resizeCanvas(false)});

  function generate(){
    current=makeQuestion();
    title.textContent=`Qual é o resultado de ${current.text}?`;
    answers.innerHTML='';

    options(current.answer).forEach((v,i)=>{
      const l=document.createElement('label'); l.className='option'; l.htmlFor=`a${i}`;
      const r=document.createElement('input'); r.type='radio'; r.name='answer'; r.id=`a${i}`; r.value=v;
      const s=document.createElement('span'); s.className='value'; s.textContent=v;
      l.append(r,s); answers.appendChild(l);
    });

    count.textContent=`Questão ${question} de ${TOTAL}`;
    error.textContent='';
    if(settings.draw) requestAnimationFrame(()=>resizeCanvas(true));
  }

  function begin(){
    if(!initialized || completed)return;
    check.className='check loading';
    setTimeout(()=>{
      check.className='check';
      question=1;
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
      generate();
    },650);
  }

  function reset(){question=1;generate()}

  function fail(){
    error.textContent='Resposta incorreta. A verificação será reiniciada.';
    setTimeout(reset,800);
  }

  verify.onclick=()=>{
    const selected=answers.querySelector('input[name="answer"]:checked');
    if(!selected){error.textContent='Selecione uma resposta.';return}

    // Com cheats=true, qualquer alternativa selecionada é tratada como correta.
    const accepted = settings.cheats || Number(selected.value) === current.answer;
    if(!accepted){fail();return}

    if(question<TOTAL){question++;generate();return}

    completed=true;
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden','true');
    check.className='check done';
    help.style.display='block';
  };

  cancel.onclick=()=>{
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden','true');
    check.className='check';
  };

  function activate(){if(initialized && !completed)begin()}
  checkArea.onclick=activate;
  label.onclick=activate;
  checkArea.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}};
  retry.onclick=e=>{e.preventDefault();location.reload()};

  loadSettings();
})();
</script>
</body>
</html>
